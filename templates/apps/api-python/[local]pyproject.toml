[project]
name = "{{dashCase name}}-service"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "litestar[standard]>=2.14.0",
    "tortoise-orm[asyncpg]>=0.21.7",
    "aerich>=0.7.2",
    "authlib>=1.3.2",
    "argon2-cffi>=23.1.0",
    "pydantic-settings>=2.5.2",
    "uvicorn[standard]>=0.30.6",
]

[dependency-groups]
dev = [
    "mypy>=1.11.0",
]

[tool.aerich]
tortoise_orm = "src.db.TORTOISE_ORM"
location = "./migrations"
src_folder = "."
